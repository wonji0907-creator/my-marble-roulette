name: Event-aware recovery experiment
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/winrate.ts'
      - 'src/physics-box2d.ts'
      - '.github/workflows/winrate-experiment.yml'
      - 'package.json'
jobs:
  winrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Compare baseline and event-aware recovery
        run: npm run winrate -- 300 5
